function sacCompat(d,b){if(d.id==b.id)return false;if(['bmo','bma'].includes(d.id)&&b.id=='bmx')return false;if(['slo','cur'].includes(d.id)&&['fus','len'].includes(b.id))return false;return true}
function sacGen(){const Ds=SAD.filter(d=>d.ok()).sort(()=>Math.random()-.5),Bs=SAB.filter(b=>b.ok()),out=[],uB=new Set;
for(const d of Ds){if(out.length>=3)break;let c=Bs.filter(b=>!uB.has(b.id)&&sacCompat(d,b)&&b.w>=d.w&&b.w<=d.w+1);if(!c.length)c=Bs.filter(b=>!uB.has(b.id)&&sacCompat(d,b));if(!c.length)continue;const b=rndp(c);uB.add(b.id);out.push({d,b,dt:d.d(),bt:b.d(),a:0})}return out}

function magnet(b,p){if(!SAC.ima||!b.n)return;const MR=118;let n=0;for(const o of balls){if(o.dead||!o.n||o===b)continue;const dx=p[0]-o.x,dy=p[1]-o.y,d=Math.hypot(dx,dy);if(d>MR||d<1)continue;const k=1.1+2.1*(1-d/MR);o.vx+=dx/d*k;o.vy+=dy/d*k;n++;for(let i=0;i<5;i++){const q=Math.random();parts.push({x:o.x+(p[0]-o.x)*q*.35,y:o.y+(p[1]-o.y)*q*.35,vx:rnd(-.6,.6),vy:rnd(-.6,.6),l:rnd(14,26),c:Math.random()<.5?'#9ff1ff':'#c9a6ff',z:rnd(2,3.5)})}}if(n){pop(p[0],p[1]-110,'ÍMÃ! '+n,'#9ff1ff',.85);SFX.mag()}}
// ---- mira com rebotes (Olho da Caixa) ----
function trace(x,y,ux,uy,ign){let t=1e9,hit=null,ax=0;const x0=FX+R,x1=FX+FW-R,y0=FY+R,y1=FY+FH-R;
if(ux>1e-9){const s=(x1-x)/ux;if(s<t){t=s;ax=1}}if(ux<-1e-9){const s=(x0-x)/ux;if(s<t){t=s;ax=1}}if(uy>1e-9){const s=(y1-y)/uy;if(s<t){t=s;ax=2}}if(uy<-1e-9){const s=(y0-y)/uy;if(s<t){t=s;ax=2}}
for(const b of balls){if(b.dead||ign.includes(b))continue;const ox=x-b.x,oy=y-b.y,B=ux*ox+uy*oy,D=B*B-(ox*ox+oy*oy-4*R*R);if(D>=0){const s=-B-Math.sqrt(D);if(s>.01&&s<t){t=s;hit=b}}}
return{t:Math.max(0,t),hit,ax}}
function bpath(x,y,ux,uy,ign,nb,col,skip){g.save();g.lineWidth=2;g.setLineDash([4,5]);g.lineDashOffset=-T*.4;g.strokeStyle=col;g.fillStyle=col;
for(let k=0;k<=nb;k++){const h=trace(x,y,ux,uy,ign),ex=x+ux*h.t,ey=y+uy*h.t;if(!(skip&&k==0)){g.beginPath();g.moveTo(x,y);g.lineTo(ex,ey);g.stroke()}
if(h.hit){g.setLineDash([]);g.beginPath();g.arc(ex,ey,R,0,7);g.stroke();g.setLineDash([4,5]);break}
if(PK.some(p=>Math.hypot(p[0]-ex,p[1]-ey)<p[2]+R*.4))break;
g.setLineDash([]);g.save();g.translate(ex,ey);g.rotate(Math.PI/4);g.fillStyle=col;g.fillRect(-4,-4,8,8);g.strokeStyle=OD;g.lineWidth=1.2;g.strokeRect(-4,-4,8,8);g.restore();tx(''+(k+1),ex+(ux>0?-12:12),ey+(uy>0?-12:12),11,col,'center',1,0,1);g.setLineDash([4,5]);
if(h.ax==1)ux=-ux;else uy=-uy;x=ex;y=ey}g.restore()}
function aimBounce(c,dx,dy){const h=trace(c.x,c.y,dx,dy,[c]);if(h.hit){const hx=c.x+dx*h.t,hy=c.y+dy*h.t,b=h.hit,nx=(b.x-hx)/(2*R),ny=(b.y-hy)/(2*R);
bpath(b.x,b.y,nx,ny,[b,c],2,'#9ff1ff',false);let tx_=dx-(dx*nx+dy*ny)*nx,ty_=dy-(dx*nx+dy*ny)*ny;const l=Math.hypot(tx_,ty_);if(l>.12)bpath(hx,hy,tx_/l,ty_/l,[c,b],1,'rgba(255,255,255,.55)',false)}
else bpath(c.x,c.y,dx,dy,[c],3,'#ffd36a',true)}
